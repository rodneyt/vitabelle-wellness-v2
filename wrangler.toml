name = "vitabelle-wellness-v2"
compatibility_date = "2024-09-23"

[assets]
directory = "./"

[[d1_databases]]
binding = "DB"
database_name = "vitabelle-crm"
database_id = "00000000-0000-0000-0000-000000000000" # Update this after running `wrangler d1 create vitabelle-crm`

[[r2_buckets]]
binding = "PDF_BUCKET"
bucket_name = "vitabelle-pdfs"

[vars]
TURNSTILE_SITE_KEY = "0x4AAAAAAABBBBBBBBBBBBBB" # Placeholder, update with real key
BUSINESS_NAME = "Vita Belle Wellness"
SITE_URL = "https://vitabellewellness.com"

# Estos van en `wrangler secret put`, NO en el archivo:
# ENCRYPTION_KEY (base64, 256-bit)
# HMAC_KEY (base64, 256-bit)
# TURNSTILE_SECRET_KEY
# PDF_SIGNING_SECRET (para URLs firmadas)
